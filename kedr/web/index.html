<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кедр — SACD в FLAC или MP3</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/i18n.js"></script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#2a2118"/>
          <path fill="#e39a4b" d="M16 5 20.2 12.2H11.8L16 5Z"/>
          <path fill="#e8b56d" d="M16 9.2 22.4 18.4H9.6L16 9.2Z"/>
          <path fill="#f0d3a4" d="M16 14.2 24.2 25.2H7.8L16 14.2Z"/>
          <rect x="14.4" y="24.2" width="3.2" height="4.2" rx="0.6" fill="#c4844a"/>
        </svg>
        <div>
          <p class="eyebrow" data-i18n="eyebrow">Утилита для macOS</p>
          <h1>Кедр</h1>
        </div>
      </div>
      <p id="health" class="health">Проверяю инструменты…</p>
    </header>

    <p id="notice" class="notice" hidden></p>

    <div class="workspace">
      <section class="panel library" aria-labelledby="tracks-title">
        <div class="source-row">
          <input id="iso-path" type="text" spellcheck="false" placeholder="SACD ISO или DSF" aria-label="Путь к файлу" autocomplete="off" data-i18n-placeholder="isoPlaceholder" data-i18n-aria="filePath">
          <button id="pick-file" class="ghost" type="button" data-i18n="pickFile">Файл</button>
          <button id="read-disc" class="primary" type="button" data-i18n="readDisc">Прочитать</button>
        </div>
        <div id="disc" class="disc empty">
          <p class="disc-kicker">Оглавление</p>
          <p class="disc-title">Диск ещё не прочитан</p>
          <p class="disc-copy">Выберите образ или уже извлечённый DSF.</p>
        </div>
        <div id="areas" class="segment" hidden></div>
        <div class="panel-head split">
          <div>
            <h2 id="tracks-title" data-i18n="tracksTitle">Дорожки</h2>
            <p id="tracks-meta">Появятся после чтения диска.</p>
          </div>
          <label id="select-all-wrap" class="check-all" hidden>
            <input id="select-all" type="checkbox" checked>
            <span data-i18n="selectAll">Все</span>
          </label>
        </div>
        <div id="progress" class="progress" hidden>
          <div id="progress-bar"></div>
        </div>
        <p id="job-message" class="job-message" hidden></p>
        <div class="track-scroll">
          <ol id="track-list"></ol>
        </div>
        <div id="done" class="done" hidden>
          <p id="done-text"></p>
          <button id="reveal" class="ghost" type="button" data-i18n="reveal">Открыть папку</button>
        </div>
      </section>

      <section class="panel settings" aria-labelledby="pcm-title">
        <div class="settings-body">
        <div class="panel-head split">
          <div>
            <h2 id="pcm-title">FLAC</h2>
            <p id="pcm-lead">176,4 кГц, 24 бит, срез 40 кГц.</p>
          </div>
          <div id="locale" class="segment locale" role="group" aria-label="Язык"></div>
        </div>
        <fieldset>
          <legend data-i18n="format">Формат</legend>
          <div id="format" class="segment" role="group"></div>
          <p id="format-hint" class="hint" hidden></p>
        </fieldset>
        <fieldset>
          <legend data-i18n="sampleRate">Частота</legend>
          <div id="rate" class="segment" role="group"></div>
        </fieldset>
        <fieldset id="bits-block">
          <legend data-i18n="bitDepth">Разрядность</legend>
          <div id="bits" class="segment" role="group"></div>
        </fieldset>
        <fieldset id="bitrate-block" hidden>
          <legend data-i18n="bitrate">Битрейт, кбит/с</legend>
          <div id="bitrate" class="segment" role="group"></div>
        </fieldset>
        <fieldset>
          <legend data-i18n="lowpass">Срез шума</legend>
          <div id="lowpass" class="segment" role="group"></div>
        </fieldset>
        <label id="compression-block" class="field">
          <span><span data-i18n="compression">Сжатие FLAC</span> <strong id="compression-label">8</strong></span>
          <input id="compression" type="range" min="0" max="8" step="1" value="8">
        </label>
        <label class="field">
          <span data-i18n="saveTo">Куда сохранить</span>
          <div class="source-row">
            <input id="out-path" type="text" spellcheck="false" placeholder="/Users/pavel/Music" aria-label="Папка для альбомов" autocomplete="off" data-i18n-aria="folderPath">
            <button id="pick-folder" class="ghost" type="button" data-i18n="pickFolder">Папка</button>
          </div>
        </label>
        <p id="preview" class="preview"></p>
        <p id="estimate" class="hint"></p>
        </div>
        <div class="actions">
          <button id="convert" class="primary wide" type="button" disabled>Преобразовать в FLAC</button>
          <button id="cancel" class="ghost" type="button" hidden data-i18n="cancel">Остановить</button>
        </div>
      </section>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
